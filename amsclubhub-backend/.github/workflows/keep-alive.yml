name: Keep Render Alive + Trigger Reminders

on:
  schedule:
    - cron: '*/5 * * * *'  # Mỗi 5 phút
  workflow_dispatch:  # Cho phép trigger thủ công từ GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API to keep alive + trigger email reminders
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" https://api.amsclubhub.com/
          curl -s -o /dev/null -w "Scheduler: %{http_code}\n" https://api.amsclubhub.com/api/v1/scheduler/run-now
